<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso · Sistema de Catequesis</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        html, body { max-width: 100%; overflow-x: hidden; }
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 12px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-card { background: white; width: 100%; max-width: 400px; padding: 20px 16px; border-radius: 10px; box-shadow: 0 4px 14px rgba(0,0,0,0.1); overflow-wrap: break-word; }
        .logos-institucionales { display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
        .logo-item { display: none; flex-direction: column; align-items: center; gap: 3px; background: #f8faf8; padding: 6px 8px; border-radius: 7px; border: 1px solid #d6e2d6; max-width: 120px; }
        .logo-item img { max-height: 27px; max-width: 45px; width: auto; height: auto; object-fit: contain; }
        .logo-item span { font-size: 9px; color: #2e7d32; font-weight: bold; text-transform: uppercase; letter-spacing: 0.2px; text-align: center; line-height: 1.15; word-break: break-word; }
        .diocesis-tag { margin: 0 0 4px 0; color: #1b5e20; font-size: 11px; font-weight: bold; text-align: center; text-transform: uppercase; letter-spacing: 0.4px; min-height: 14px; }
        h2 { margin: 0 0 4px 0; color: #2e7d32; font-size: 18px; text-align: center; line-height: 1.25; }
        .sub-parroquia { margin: 0 0 16px 0; color: #666; font-size: 12px; text-align: center; line-height: 1.35; }
        label { display: block; font-size: 12px; font-weight: bold; color: #444; margin-bottom: 4px; }
        input { width: 100%; max-width: 100%; padding: 9px 10px; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 12px; font-size: 14px; }
        button { width: 100%; max-width: 100%; background: #2e7d32; color: white; border: none; padding: 10px; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; }
        button:hover { background: #256428; }
        .msg { margin-top: 10px; font-size: 12px; text-align: center; color: #c62828; }
        .modal-recovery { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55); justify-content: center; align-items: center; padding: 12px; z-index: 999; }
        .modal-recovery-card { background: white; width: 100%; max-width: 380px; padding: 20px 16px; border-radius: 10px; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2); }
        @media (max-width: 420px) {
            body { padding: 8px; }
            .login-card { padding: 16px 12px; border-radius: 8px; }
            h2 { font-size: 17px; }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logos-institucionales" id="boxLogosInstitucionales">
            <div class="logo-item" id="boxLogoDiocesis">
                <img id="logoDiocesis" alt="Logo Diócesis">
                <span id="etiquetaLogoDiocesis">Diócesis</span>
            </div>
            <div class="logo-item" id="boxLogoParroquia">
                <img id="logoParroquia" alt="Logo Parroquia">
                <span id="etiquetaLogoParroquia">Parroquia</span>
            </div>
            <div class="logo-item" id="boxLogoPastoral">
                <img id="logoPastoral" alt="Logo Pastoral">
                <span id="etiquetaLogoPastoral">Catequesis</span>
            </div>
        </div>

        <p class="diocesis-tag" id="etiquetaDiocesisLogin"></p>
        <h2 id="tituloLoginParroquia">Sistema de Catequesis</h2>
        <p class="sub-parroquia" id="subtituloLoginParroquia">Ingresa con tu usuario y contraseña</p>

        <form id="formLogin">
            <label for="loginUsuario">Usuario (o correo)</label>
            <input type="text" id="loginUsuario" placeholder="Ej: carmen1 o maria.perez" required autocomplete="username">
            <label for="loginPassword">Contraseña</label>
            <input type="password" id="loginPassword" placeholder="Tu contraseña" required autocomplete="current-password">
            <button type="submit" id="btnEntrar">Ingresar</button>
        </form>
        <div class="msg" id="msgLogin"></div>
    </div>

    <div class="modal-recovery" id="boxNuevaPassword">
        <div class="modal-recovery-card">
            <h2>Nueva Contraseña</h2>
            <p class="sub-parroquia" style="margin-bottom:14px;">Escribe tu nueva contraseña para completar la recuperación.</p>
            <form id="formNuevaPassword">
                <label for="nuevaClaveInput">Nueva contraseña (mín. 6 caracteres)</label>
                <input type="password" id="nuevaClaveInput" minlength="6" required placeholder="Nueva contraseña" autocomplete="new-password">
                <button type="submit" id="btnGuardarNuevaClave">Guardar nueva contraseña</button>
            </form>
            <div class="msg" id="msgNuevaClave"></div>
        </div>
    </div>

    <script type="module">
        import { supabase } from './supabaseClient.js'

        function mostrarLogoSiCarga(imgEl, boxEl, url) {
            if (!url || !imgEl || !boxEl) {
                if (boxEl) boxEl.style.display = 'none'
                return
            }
            imgEl.src = url
            imgEl.onload = () => { boxEl.style.display = 'flex' }
            imgEl.onerror = () => { boxEl.style.display = 'none' }
        }

        async function cargarPersonalizacionLogin() {
            try {
                const { data } = await supabase.from('configuracion_parroquia').select('*').limit(1).maybeSingle()

                const nombreDiocesis = data?.nombre_diocesis || localStorage.getItem('nombre_diocesis') || ''
                const nombreParroquia = data?.nombre_parroquia || localStorage.getItem('nombre_parroquia') || 'Sistema de Catequesis'
                const localidad = data?.localidad || localStorage.getItem('localidad_parroquia') || ''

                if (nombreDiocesis) {
                    document.getElementById('etiquetaDiocesisLogin').textContent = nombreDiocesis
                    document.getElementById('etiquetaLogoDiocesis').textContent = nombreDiocesis
                }
                document.getElementById('tituloLoginParroquia').textContent = nombreParroquia
                document.getElementById('etiquetaLogoParroquia').textContent = nombreParroquia

                if (localidad) {
                    document.getElementById('subtituloLoginParroquia').textContent = `${localidad} · Ingresa con tu usuario y contraseña`
                }

                const urlDiocesis = data?.logo_diocesis_url || localStorage.getItem('logo_diocesis') || ''
                const urlParroquia = data?.logo_parroquia_url || localStorage.getItem('logo_parroquia_1') || ''
                const urlPastoral = data?.logo_pastoral_url || data?.logo_secundario_url || localStorage.getItem('logo_parroquia_2') || ''

                mostrarLogoSiCarga(document.getElementById('logoDiocesis'), document.getElementById('boxLogoDiocesis'), urlDiocesis)
                mostrarLogoSiCarga(document.getElementById('logoParroquia'), document.getElementById('boxLogoParroquia'), urlParroquia)
                mostrarLogoSiCarga(document.getElementById('logoPastoral'), document.getElementById('boxLogoPastoral'), urlPastoral)
            } catch (_) {}
        }

        function mostrarModalRecuperacion() {
            const box = document.getElementById('boxNuevaPassword')
            if (box) box.style.display = 'flex'
        }

        if ((window.location.hash || '').includes('type=recovery')) {
            mostrarModalRecuperacion()
        }

        supabase.auth.onAuthStateChange((event) => {
            if (event === 'PASSWORD_RECOVERY') {
                mostrarModalRecuperacion()
            }
        })

        cargarPersonalizacionLogin()

        document.getElementById('formNuevaPassword')?.addEventListener('submit', async (e) => {
            e.preventDefault()
            const msg = document.getElementById('msgNuevaClave')
            const btn = document.getElementById('btnGuardarNuevaClave')
            const password = document.getElementById('nuevaClaveInput').value

            msg.textContent = ''
            btn.disabled = true
            btn.textContent = 'Guardando...'

            try {
                const { error } = await supabase.auth.updateUser({ password })
                if (error) throw error

                msg.style.color = '#1b5e20'
                msg.textContent = '¡Contraseña actualizada! Redirigiendo al panel...'
                history.replaceState(null, '', window.location.pathname + window.location.search)
                setTimeout(() => {
                    window.location.href = './dashboard.html'
                }, 1200)
            } catch (err) {
                msg.style.color = '#c62828'
                msg.textContent = err.message || 'No se pudo actualizar la contraseña.'
                btn.disabled = false
                btn.textContent = 'Guardar nueva contraseña'
            }
        })

        document.getElementById('formLogin').addEventListener('submit', async (e) => {
            e.preventDefault()
            const msg = document.getElementById('msgLogin')
            const btn = document.getElementById('btnEntrar')
            msg.textContent = ''
            btn.disabled = true
            btn.textContent = 'Verificando...'

            try {
                const entrada = document.getElementById('loginUsuario').value.trim()
                let emailAuth = entrada

                if (!entrada.includes('@')) {
                    const { data: correoResuelto, error: rpcErr } = await supabase
                        .rpc('obtener_correo_por_usuario', { p_usuario: entrada })

                    if (rpcErr || !correoResuelto) {
                        throw new Error('Usuario no encontrado. Verifica el nombre de usuario.')
                    }
                    emailAuth = correoResuelto
                }

                const { error } = await supabase.auth.signInWithPassword({
                    email: emailAuth,
                    password: document.getElementById('loginPassword').value
                })

                if (error) throw error
                window.location.href = './dashboard.html'
            } catch (err) {
                msg.textContent = err.message || 'No se pudo iniciar sesión.'
                btn.disabled = false
                btn.textContent = 'Ingresar'
            }
        })
    </script>
</body>
</html>
